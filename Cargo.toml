[package]
name = "poker-equity"
version = "0.1.0"
edition = "2021"
description = "Equity for fourteen poker variants, sampled or enumerated exactly"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["poker", "equity", "odds", "holdem", "omaha"]
categories = ["games", "algorithms", "simulation"]
repository = "https://github.com/kruux/poker-equity"

# The published archive is the library and what proves it: the validation
# scripts want pokerkit, and the throttling script is about this machine.
exclude = ["/validation", "/scripts", "/.vscode", "/.github"]

# A cdylib so the Python extension can be built, an rlib so the crate stays a
# normal Rust library. The core never depends on Python: the binding is one
# module behind a feature, so a standalone binary or a C ABI would be an
# addition rather than a rewrite.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
python = ["dep:pyo3"]

[dependencies]
enum-iterator = "2.1.0"
itertools = "0.14.0"
rand = { version = "0.8.5", features = ["small_rng"] }
rayon = "1.10.0"

# One wheel per platform covering CPython 3.10 upward. abi3 names a floor
# rather than a target, so the lowest version PyO3 offers is the widest reach;
# free-threaded builds are a separate wheel and are out of scope.
pyo3 = { version = "0.29.2", features = ["abi3-py310", "extension-module"], optional = true }

# The equity tests run a hundred thousand Monte Carlo deals apiece, which is
# minutes unoptimised and seconds optimised. Debug info is kept, so backtraces
# and the debugger still work.
[profile.test]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
indicatif = "0.17.9"

# The compatibility layer, not CodSpeed itself: `cargo bench` runs these as
# ordinary criterion benchmarks, and CI runs the same definitions under
# callgrind. No plotting or HTML, which is most of criterion's dependency
# tree and none of its use here.
codspeed-criterion-compat = { version = "5.0.1", default-features = false, features = ["cargo_bench_support"] }

# Instruction counts, not wall clock, so the numbers mean the same thing on
# any machine. See benches/engine.rs.
[[bench]]
name = "engine"
harness = false
