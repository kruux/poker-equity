name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      # Tests build at opt-level 2 already, so there is no second release
      # build to pay for here.
      - name: Test
        run: cargo test --verbose

      # The kernel sweeps: a minute or two of work, and the only tests that
      # walk every hand in a space rather than sampling it.
      - name: Exhaustive sweeps
        run: cargo test --verbose -- --ignored

  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --check

      # --all-features reaches the Python module, which is not compiled
      # otherwise and so would go unlinted.
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  python:
    name: Python binding on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      # The oldest interpreter the abi3-py310 build claims to serve. If the
      # module loads here it loads on everything above it.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      # Exactly what the README tells a reader with a clone to run, and the
      # same pyproject.toml the release wheels are built from -- so a
      # packaging mistake shows up on the push that made it, not at a tag.
      - name: Build and install the package
        run: python -m pip install .

      # From outside the checkout, so it is the installed package under test.
      - name: Check the binding against the engine
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/tests/python/test_binding.py"

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest

    # OIDC: GitHub mints a short-lived token for this job and CodSpeed
    # verifies it, so there is no secret to store or rotate. Scoped to the one
    # job rather than the workflow, which is GitHub's guidance for it.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-codspeed
        run: cargo install cargo-codspeed --locked

      - name: Build the benchmarks
        run: cargo codspeed build

      # Simulation mode: each benchmark runs once under a simulated CPU,
      # counting instructions and cache behaviour instead of seconds, so the
      # figure does not depend on this runner or its load. Walltime is the
      # other option and wants CodSpeed's own bare-metal machines, which would
      # put the noise back. CodSpeed measures the base commit the same way in
      # the same run and comments the difference on the pull request.
      - uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: cargo codspeed run
